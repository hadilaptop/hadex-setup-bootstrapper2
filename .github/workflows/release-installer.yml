name: Build and publish Hadex installer

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Windows installer
        run: npm run dist

      - name: Verify installer
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          $installer = "dist/Hadex Browser Setup $version.exe"
          if (-not (Test-Path -LiteralPath $installer -PathType Leaf)) {
            throw "Build output not found: $installer"
          }
          $file = Get-Item -LiteralPath $installer
          $hash = (Get-FileHash -LiteralPath $installer -Algorithm SHA256).Hash
          Write-Host "Installer: $($file.FullName)"
          Write-Host "Size: $($file.Length) bytes"
          Write-Host "SHA256: $hash"

      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = node -p "require('./package.json').version"
          $tag = $env:GITHUB_REF_NAME
          $installer = "dist/Hadex Browser Setup $version.exe"
          gh release create $tag $installer --title "Hadex Browser Setup $version" --generate-notes
